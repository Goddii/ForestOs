<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forest Line &amp; ForestOS — interactive prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* blend: v4 teal deepened toward the forest green, cream warmth, amber accent */
  --page:#0F2019;
  --paper:#F6F3EB; --surface:#FFFEFA; --line:#E4DFD2; --line-2:#EFEAE0;
  --ink:#17261F; --ink-2:#4E5A53; --ink-3:#8A9189;
  --green:#1C6E5E; --green-2:#14574A; --green-wash:#E4F0EB; --forest:#123A2E;
  --amber:#D48A33; --amber-2:#B66F1E; --amber-wash:#FBEFDC;
  --red:#B8452F; --red-wash:#FAE6E0;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding:48px 32px 80px}
.page-head{max-width:1400px;margin:0 auto 40px;color:#E8E4D8}
.page-head .eyebrow{font-size:13px;color:#D9A55E;font-weight:600;margin-bottom:8px}
.page-head h1{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:30px;line-height:1.15;margin-bottom:10px;letter-spacing:-.01em}
.page-head p{font-size:15px;color:#B9C2BB;max-width:680px;line-height:1.55}
.page-head ul{margin:14px 0 0 18px;color:#B9C2BB;font-size:14px;line-height:1.7;max-width:720px}
.gallery{max-width:1400px;margin:0 auto;display:flex;flex-wrap:wrap;gap:40px}
.frame-block{display:flex;flex-direction:column;gap:12px}
.frame-label{font-size:13px;font-weight:600;color:#E8E4D8}
.frame-label span{font-weight:400;color:#9AA59E}

.phone{width:340px;min-height:734px;border-radius:44px;background:#0a0a0a;padding:11px;box-shadow:0 24px 48px -12px rgba(0,0,0,.45)}
.screen{width:100%;min-height:712px;border-radius:33px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:var(--paper)}
.statusbar{height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:12.5px;font-weight:600}
.scroll{flex:1;overflow:visible;padding:4px 18px 18px;position:relative}
.scroll::-webkit-scrollbar{width:0}

/* type: Plus Jakarta Sans throughout, as in the v4 designs; bold for titles and figures */
h1,.display{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:22px;line-height:1.2;letter-spacing:-.015em}
.sub{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.center{text-align:center}
.muted{color:var(--ink-3);font-weight:400}
.section{font-size:13px;font-weight:600;margin:20px 0 9px}
.section .muted{font-size:12px;margin-left:4px}
.label{font-size:12.5px;font-weight:600;margin:16px 0 8px}
.label.sm{font-size:12px;color:var(--ink-2);margin-top:12px}
.hint{font-size:11.5px;color:var(--ink-2);line-height:1.5;margin-top:9px}
.hint b{color:var(--ink);font-weight:600}
.fine{font-size:11px;color:var(--ink-3);line-height:1.5;margin-top:10px}
.link{color:var(--green);font-weight:600}
.small{font-size:12px}

/* header */
.phead{padding:6px 0 4px;margin-bottom:6px}
.back{margin:2px 0 8px}
.phead-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--green-wash);color:var(--green-2);display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.avatar.lg{width:42px;height:42px;background:var(--forest);color:#fff}
.avatar.sm{width:32px;height:32px;font-size:12px}
.avatar.xl{width:72px;height:72px;font-size:24px;background:var(--forest);color:#fff;margin:0 auto 10px}
.align-pill{display:inline-block;margin-top:10px;font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:999px;background:var(--green-wash);color:var(--green-2)}
.align-pill.nursery{background:var(--amber-wash);color:var(--amber-2);margin-bottom:2px}

/* hero (from the friend's design) */
.hero{margin-top:14px;background:var(--forest);color:#fff;border-radius:18px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.hero.soft{background:var(--green-wash);color:var(--ink)}
.hero-k{font-size:11.5px;color:#A9C6BB;font-weight:500}
.hero.soft .hero-k{color:var(--green-2)}
.hero-t{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:18px;line-height:1.25;margin-top:3px}
.hero-t.big{font-size:26px;letter-spacing:-.01em}
.hero-s{font-size:11.5px;color:#C8DAD2;line-height:1.45;margin-top:5px}
.hero.soft .hero-s{color:var(--ink-2)}
.hero-go{background:var(--amber);color:#fff;font-weight:700;font-size:13px;padding:10px 14px;border-radius:999px;flex-shrink:0}

/* mini components */
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 10px}
.mini-k{font-size:11px;color:var(--ink-2);font-weight:500;min-height:28px;line-height:1.25}
.mini-v{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:22px;line-height:1.15;margin-top:3px}
.mini-v small{font-family:'Plus Jakarta Sans',sans-serif;font-weight:500;font-size:11px;color:var(--ink-3);margin-left:2px}
.mini-s{font-size:10.5px;line-height:1.3;margin-top:3px}
.ok{color:var(--green)} .bad{color:var(--red)} .warn{color:var(--amber-2)}

/* alerts */
.alert{border-radius:var(--r);padding:12px 13px;margin-bottom:9px;border:1px solid}
.alert.red{background:var(--red-wash);border-color:#EFC5BA}
.alert.amber{background:var(--amber-wash);border-color:#EDD3AE}
.alert.slim{margin-top:10px}
.alert-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.alert-top b{font-size:13px;line-height:1.3}
.alert p{font-size:11.5px;color:var(--ink-2);line-height:1.45;margin-top:4px}
.alert p b{color:var(--ink)}
.alert-actions{display:flex;gap:7px;margin-top:10px}
.tag{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;flex-shrink:0}
.tag.red{background:#fff;color:var(--red)} .alert .tag.red{border:1px solid #EFC5BA}
.tag.amber{background:var(--amber-wash);color:var(--amber-2)} .alert .tag.amber{background:#fff}
.tag.green{background:var(--green-wash);color:var(--green-2)}
.tag.teal{background:#E3EEF0;color:#2B6470}
.mbtn{flex:1;text-align:center;font-size:12px;font-weight:600;padding:9px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.mbtn.solid{background:var(--green);border-color:var(--green);color:#fff}
.mbtn.solid-red{background:var(--red);border-color:var(--red);color:#fff}

/* cards and lists */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.row-card{display:flex;justify-content:space-between;align-items:center}
.row-card b{font-size:13.5px}
.row-card p{font-size:12px;margin-top:2px}
.list{padding:2px 13px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line-2);font-size:12.5px}
.li:first-child{border-top:0}
.li b{font-weight:600}
.li div span{display:block;font-size:11px;color:var(--ink-3);margin-top:1px}
.li.more{justify-content:space-between}
.amt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}

/* segmented toggle */
.seg{display:flex;background:#ECE7DB;border-radius:999px;padding:4px;gap:4px;margin-top:12px}
.seg span{flex:1;text-align:center;padding:8px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.seg span.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(23,38,31,.12)}

/* grid chips (were "plots") */
.gchips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.gchip{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 9px}
.gchip b{display:block;font-size:12px}
.gchip span{font-size:10.5px;color:var(--ink-3)}
.gchip.today{border-color:var(--green)}
.gchip.on{background:var(--green);border-color:var(--green)}
.gchip.on b,.gchip.on span{color:#fff}

/* plucker search + card */
.select-btn{display:flex;align-items:center;gap:9px;background:var(--surface);border:1.5px dashed var(--green);border-radius:var(--r);padding:12px 13px;font-size:13px;font-weight:600;color:var(--green)}
.select-btn em{margin-left:auto;font-style:normal;font-weight:400;font-size:11px;color:var(--ink-3)}
.pcard{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.pcard-top{display:flex;align-items:center;gap:10px}
.pcard-name b{display:block;font-size:14px}
.pcard-name span{font-size:11.5px;color:var(--ink-2)}
.locked{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--ink-3)}
.pfacts{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line-2)}
.pfacts div:last-child{grid-column:1/-1}
.pfacts dt{font-size:10.5px;color:var(--ink-3)}
.pfacts dd{font-size:12.5px;font-weight:600;margin-top:1px}

.sheet-dim{position:absolute;inset:-4px -18px -18px;background:rgba(18,58,46,.35)}
.sheet{position:absolute;left:-18px;right:-18px;bottom:-18px;top:70px;background:var(--surface);border-radius:22px 22px 0 0;padding:8px 34px 30px;overflow:hidden}
.grabber{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 10px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.search{display:flex;align-items:center;gap:9px;margin-top:12px;border:1.5px solid var(--green);border-radius:12px;padding:11px 12px;font-size:14px}
.typed::after{content:"";display:inline-block;width:1.5px;height:15px;background:var(--green);margin-left:1px;vertical-align:-2px}
.res{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:12px;margin:0 -8px}
.res.on{background:var(--green-wash)}
.res-t b{display:block;font-size:13px}
.res-t span{font-size:11px;color:var(--ink-2)}
.tick{margin-left:auto;color:var(--green);font-weight:700}
.notfound{margin-top:14px;padding-top:12px;border-top:1px solid var(--line-2);font-size:12px;color:var(--ink-2)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;font-weight:600;padding:7px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}

.more-tasks{margin-top:10px;font-size:12px;font-weight:600;color:var(--green)}
.more-tasks .muted{font-weight:400;font-size:11px}
/* fields */
.field{display:block;margin-top:12px}
.field > span{display:block;font-size:12px;font-weight:600;margin-bottom:6px}
.field em{font-style:normal;font-weight:400;color:var(--ink-3)}
.input{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:13px;color:var(--ink-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* buttons */
.btn{margin-top:16px;text-align:center;font-weight:700;font-size:14px;padding:14px;border-radius:999px}
.btn.primary{background:var(--green);color:#fff}
.btn.amber{background:var(--amber);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}

/* stats */
.stat-strip{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:12px}
.stat-strip.three{grid-template-columns:repeat(3,1fr)}
.stat-strip div{padding:11px 12px;border-left:1px solid var(--line-2)}
.stat-strip div:first-child{border-left:0}
.stat-strip p{font-size:11px;color:var(--ink-2)}
.stat-strip b{display:block;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:20px;line-height:1.3;white-space:nowrap}
.stat-strip span{font-size:10.5px;color:var(--ink-3)}

.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:118px 1fr 26px;align-items:center;gap:9px;font-size:12px}
.bar{height:8px;border-radius:999px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:999px}
.bar-row b{text-align:right}

.log{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:2px 12px}
.log-row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line-2)}
.log-row:first-child{border-top:0}
.log-row time{font-size:11px;color:var(--ink-3)}
.log-row b{display:block;font-size:12.5px}
.log-row div span{font-size:11px;color:var(--ink-2)}
.log-row.more{display:block;text-align:center}

.rota{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.rota-d{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 0;text-align:center}
.rota-d span{display:block;font-size:10.5px;color:var(--ink-3)}
.rota-d b{font-size:13px}
.rota-d.on{background:var(--forest);border-color:var(--forest)}
.rota-d.on span{color:#A9C6BB} .rota-d.on b{color:#fff}

/* weigh in */
.synced{display:flex;align-items:center;gap:8px;margin-top:12px;background:var(--green-wash);color:var(--green-2);font-size:11.5px;font-weight:500;padding:9px 11px;border-radius:12px;line-height:1.4}
.wrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;margin-top:9px}
.wrow-top{display:flex;justify-content:space-between;align-items:flex-start}
.wrow-top b{font-size:13.5px;display:block}
.wrow-top div span{font-size:11px;color:var(--ink-3)}
.kg{text-align:right}
.kg b{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:19px;line-height:1.1}
.kg small{display:block;font-size:10px;color:var(--ink-3)}
.wrow-meta{margin-top:6px;font-size:11px;color:var(--ink-2)}
.rid{font-size:10.5px;color:var(--ink-3);margin-top:2px}
.wrow .mbtn{display:block;margin-top:9px}
.rec-done{margin-top:9px;font-size:12px;font-weight:600;color:var(--green);text-align:center;padding:8px;background:var(--green-wash);border-radius:999px}

/* receipt */
.receipt{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rc-top{background:var(--forest);color:#fff;padding:14px 15px}
.rc-top p{font-size:11px;color:#A9C6BB}
.rc-top b{font-size:16px;letter-spacing:.01em}
.rc-body{padding:4px 15px}
.rc-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12px}
.rc-row:last-child{border-bottom:0}
.rc-row span{color:var(--ink-2)}
</style>
</head>
<body>
<div id="hub" class="hub">
  <div class="page-head">
    <div class="eyebrow">FIELD CAPTURE &middot; FORESTOS EDGE</div>
    <h1>Forest Line &amp; ForestOS</h1>
    <p>Interactive prototype &middot; South West Mau &middot; Monday 28 September 2026</p>
  </div>
</div>
</body>
</html>
